<div class="flex h-full flex-col bg-background text-foreground">
    <main class="flex-1 overflow-y-auto p-4">
        @if (!isGameActive()) {
        <div class="mx-auto flex h-full max-w-md flex-col pt-8">
            <app-player-input [players]="players()" (playersChange)="updatePlayers($event)" />

            <div class="mt-auto pb-4 pt-8">
                <button hlmBtn class="h-12 w-full text-base" [disabled]="players().length === 0" (click)="startGame(players())">
                    Comenzar partida
                </button>
            </div>
        </div>
        } @else {
        <div class="flex h-full flex-col animate-in fade-in duration-500">
            <app-bazas-grid />

            @if (stateService.gameState()?.isFinished) {
            <div class="mt-6 rounded-xl border border-primary/20 bg-primary/5 p-6 text-center">
                <h2 class="mb-2 text-2xl font-bold text-primary">¡Planilla completa!</h2>
                <p class="text-muted-foreground">Ya están anotadas todas las rondas. Revisá los totales para ver quién ganó.</p>
            </div>
            }
        </div>
        }
    </main>
</div>
